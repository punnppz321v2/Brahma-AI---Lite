[QtHighDpi]
WindowsDpiAwareness = system
# Qt 6's default is PER_MONITOR_AWARE_V2, which fails with "Access is denied"
# under some Windows configurations (e.g. restricted per-monitor v2 contexts).
# Use system-level DPI awareness instead, which avoids the failed API call.
# See: https://doc.qt.io/qt-6/highdpi.html#configuring-windows
